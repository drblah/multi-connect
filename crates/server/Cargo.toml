[package]
name = "server"
version = "0.1.0"
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
smol = "2.0.2"
socket2 = "0.5.7"
anyhow = "1.0.75"
common = { path = "../common" }

log = "0.4.20"
env_logger = "0.10.0"
tokio-tun = "0.11.2"
clap = { version = "4.4.14", features = ["derive"] }
serde_json = "1.0.111"
tokio = { version = "1.40.0", features = ["full"] }